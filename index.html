 let last='';for(const e of L){const d=!e.s?'日期見內文':(e.s<T?'進行中（到 '+e.e.slice(5).replace('-','/')+' 前都可以去）':e.s.slice(5).replace('-','/')+'（'+W[new Date(e.s).getDay()]+'）');const dk=(!e.s)?'?':(e.s<T?'~':e.s);if(dk!==last){h+='<div class="day">'+d+'</div>';last=dk}h+=rowHTML(e)}
 m.innerHTML=h;dragInit()}
document.getElementById('tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;tab=b.dataset.t;[...ev.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('chips').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const f=b.dataset.f;F.has(f)?F.delete(f):F.add(f);b.classList.toggle('on');render()};
render();
</script></body></html>
