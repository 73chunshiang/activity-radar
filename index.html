const I={market:'<path d="M3 10h18l-1.5 9h-15z"/><path d="M5 10l2-5h10l2 5"/><path d="M12 10v9"/>',craft:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-2 0-3 3 0 3-2a9 9 0 0 0-5-11z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16" cy="10" r="1"/>',animal:'<circle cx="12" cy="13" r="6"/><circle cx="9" cy="12" r=".8"/><circle cx="15" cy="12" r=".8"/><path d="M6 8l-2-3M18 8l2-3"/>',music:'<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',show:'<path d="M4 5h16v10a8 8 0 0 1-16 0z"/><path d="M8 9h2M14 9h2M9 13c1 1 5 1 6 0"/>',art:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/>',farm:'<path d="M12 21V11"/><path d="M12 11c-4 0-6-3-6-6 3 0 6 2 6 6zM12 11c4 0 6-3 6-6-3 0-6 2-6 6z"/>',book:'<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',sci:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',park:'<path d="M12 22v-6"/><path d="M8 16l4-10 4 10z"/><path d="M6 16h12"/>',pin:'<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',news:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 17h10"/>'};
const kind=n=>/市集|園遊|嘉年華|節$/.test(n)?'market':/手作|DIY|彩繪|陶|絹印|工坊/.test(n)?'craft':/動物|牧場|餵|鳥|昆蟲|魚/.test(n)?'animal':/音樂|演唱|樂團|合唱|管樂/.test(n)?'music':/劇|戲|偶|魔術/.test(n)?'show':/展/.test(n)?'art':/農|採|花|稻|果|田/.test(n)?'farm':/故事|繪本|閱讀|書/.test(n)?'book':/科學|實驗|無人機|機器|工程師/.test(n)?'sci':/公園|步道|生態|山|湖|海|森林/.test(n)?'park':'pin';
const fmt=e=>{if(!e.s)return '日期見內文';const s=new Date(e.s),t=new Date(e.e||e.s);let o=(s.getMonth()+1)+'/'+s.getDate()+'（'+W[s.getDay()]+'）';if(e.e&&e.e!==e.s)o+='–'+(t.getMonth()+1)+'/'+t.getDate();if(e.t)o+=' '+e.t;return o};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function imgFail(im){const p=im.parentNode;im.remove();p.innerHTML='<svg viewBox="0 0 24 24">'+I[p.dataset.k]+'</svg>'}
function pass(e){const s=e.s?new Date(e.s):null,t=e.e?new Date(e.e):s;
 const lead=e.src==='新聞'||e.src.startsWith('粉專');if(tab==='news')return lead;if(lead)return false;
 if(tab==='weekend'&&!(s&&s<=sun&&t>=sat))return false;
 if(tab==='14'&&!(s&&s<=new Date(today.getTime()+14*864e5)&&s>=today))return false;
 for(const f of F){if(f==='new'&&!e.new)return false;if(f==='hot'&&!e.hot.length)return false;if(f==='free'&&!/免費|^0|免/.test(e.p||'')&&e.reg==='Y')return false;if(f==='noreg'&&e.reg==='Y')return false;if(['新竹','桃園','苗栗'].includes(f)&&e.c!==f)return false;if(f==='both'&&e.age)return false}
 return true}
function thumb(e){const k=e.src==='新聞'?'news':kind(e.n);return e.img?'<div class="th" data-k="'+k+'"><img src="'+esc(e.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>':'<div class="th"><svg viewBox="0 0 24 24">'+I[k]+'</svg></div>'}
function badges(e){return (e.new?'<span class="badge b-new">NEW</span>':'')+(e.full?'<span class="badge b-full">額滿</span>':'')+e.hot.map(t=>'<span class="badge b-hot">🔥'+esc(t)+'</span>').join('')}
function rowHTML(e){const meta=[e.c,e.v,e.a,e.age].filter(Boolean).join(' · ');const reg=e.reg==='Y'?'需報名'+(e.rc?'，截止 '+e.rc.slice(5).replace('-','/'):'')+(e.sl&&e.sl!=='0'?'，尚餘 '+e.sl:''):(e.reg==='N'?'免報名':'');const pr=e.p&&/免費/.test(e.p)?'免費':'';
 return '<a class="row'+(e.full?' full':'')+'" href="'+esc(e.u)+'" target="_blank" rel="noopener">'+thumb(e)+'<div class="tx"><div class="l1"><b>'+fmt(e)+'</b><span>'+esc(e.src)+'</span></div><div class="l2">'+badges(e)+esc(e.n)+'</div><div class="l3">'+esc([meta,pr,reg].filter(Boolean).join(' · '))+'</div></div></a>'}
function featured(){const wk=D.filter(e=>e.src!=='新聞'&&!e.src.startsWith('粉專')&&!e.full&&e.s&&(new Date(e.s)<=sun&&new Date(e.e||e.s)>=sat));const dur=e=>(new Date(e.e||e.s)-new Date(e.s))/864e5;const sh=wk.filter(e=>dur(e)<=7),lg=wk.filter(e=>dur(e)>7);const srt=L=>L.sort((a,b)=>(b.hot.length-a.hot.length)||(b.sc-a.sc));const pick=[...srt(sh),...srt(lg)].slice(0,5);if(!pick.length)return '';
 return '<div class="sech"><div class="sec">這週末精選</div><div class="nav"><button onclick="fscroll(-1)" aria-label="上一張">‹</button><button onclick="fscroll(1)" aria-label="下一張">›</button></div></div><div class="feat" id="feat">'+pick.map(e=>{const k=kind(e.n);const im=e.img?'<div class="im" data-k="'+k+'"><img src="'+esc(e.img)+'" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>':'<div class="im" style="display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:34px;height:34px;stroke:var(--icon);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">'+I[k]+'</svg></div>';
 return '<a class="fc" href="'+esc(e.u)+'" target="_blank" rel="noopener">'+im+'<div class="bd"><div class="d">'+fmt(e)+'</div><div class="n">'+badges(e)+esc(e.n)+'</div><div class="m">'+esc([e.c,e.v].filter(Boolean).join(' · ')||e.src)+'</div></div></a>'}).join('')+'</div>'}
function fscroll(d){const f=document.getElementById('feat');if(f)f.scrollBy({left:d*240,behavior:'smooth'})}
function dragInit(){const f=document.getElementById('feat');if(!f)return;let x0=0,s0=0,mv=false;f.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;x0=e.clientX;s0=f.scrollLeft;mv=false;f.setPointerCapture(e.pointerId);f.classList.add('drag')});f.addEventListener('pointermove',e=>{if(!f.classList.contains('drag'))return;const dx=e.clientX-x0;if(Math.abs(dx)>4)mv=true;f.scrollLeft=s0-dx});const up=e=>{if(!f.classList.contains('drag'))return;f.classList.remove('drag');if(mv){const stop=ev=>{ev.preventDefault();ev.stopPropagation()};f.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>f.removeEventListener('click',stop,{capture:true}),50)}};f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up)}
function render(){const L=D.filter(pass).sort((a,b)=>{const ka=(a.s&&a.s<T)?'~':(a.s||'9'),kb=(b.s&&b.s<T)?'~':(b.s||'9');return ka<kb?-1:ka>kb?1:b.sc-a.sc});const m=document.getElementById('m');
 let h=(tab==='14'||tab==='weekend')&&!F.size?featured():'';if(!L.length){m.innerHTML=h+'<div class="empty">這個範圍沒有活動</div>';return}
 let last='';for(const e of L){const d=!e.s?'日期見內文':(e.s<T?'進行中（到 '+e.e.slice(5).replace('-','/')+' 前都可以去）':e.s.slice(5).replace('-','/')+'（'+W[new Date(e.s).getDay()]+'）');const dk=(!e.s)?'?':(e.s<T?'~':e.s);if(dk!==last){h+='<div class="day">'+d+'</div>';last=dk}h+=rowHTML(e)}
 m.innerHTML=h;dragInit()}
document.getElementById('tabs').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;tab=b.dataset.t;[...ev.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('chips').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const f=b.dataset.f;F.has(f)?F.delete(f):F.add(f);b.classList.toggle('on');render()};
render();
</script></body></html>
